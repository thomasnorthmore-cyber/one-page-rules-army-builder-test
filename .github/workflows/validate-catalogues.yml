name: Validate OPR New Recruit catalogues
on:
  push:
    paths:
      - 'Battle_Brothers.cat'
      - 'Custodian_Brothers.cat'
      - 'Robot_Legions.cat'
      - 'scripts/validate_robot_rules.py'
      - 'scripts/validate_equipped_rules.py'
      - 'scripts/validate_custodian.py'
      - 'Grimdark_Future.gst'
      - 'scripts/validate_catalogues.py'
      - '.github/workflows/validate-catalogues.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML and links
        run: python3 scripts/validate_catalogues.py

      - name: Validate Custodian Brothers roster and links
        run: python3 scripts/validate_custodian.py
      - name: Validate Robot Legions permanent rule links
        run: python3 scripts/validate_robot_rules.py
      - name: Validate equipped-only rules across all three armies
        run: python3 scripts/validate_equipped_rules.py
