name: Validate every OPR faction
on:
  push:
    paths:
      - '*.cat'
      - '*.gst'
      - 'reference/**'
      - 'scripts/validate_all_factions.py'
      - '.github/workflows/validate-catalogues.yml'
  pull_request:
    paths:
      - '*.cat'
      - '*.gst'
      - 'reference/**'
      - 'scripts/validate_all_factions.py'
      - '.github/workflows/validate-catalogues.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every faction and produce coverage report
        run: python3 scripts/validate_all_factions.py --strict --output validation-report.json
      - name: Upload detailed report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opr-faction-validation
          path: validation-report.json
          if-no-files-found: warn
