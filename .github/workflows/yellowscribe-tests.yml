name: YellowScribe compatibility tests
on:
  push:
    paths:
      - 'scripts/prepare_yellowscribe_rosz.py'
      - 'scripts/test_yellowscribe_conversion.py'
      - '.github/workflows/yellowscribe-tests.yml'
  pull_request:
    paths:
      - 'scripts/prepare_yellowscribe_rosz.py'
      - 'scripts/test_yellowscribe_conversion.py'
      - '.github/workflows/yellowscribe-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_yellowscribe_conversion.py'
